# sharp necesita su script de instalación (binarios nativos para optimizar las
# fotos subidas). @nestjs/core y @scarf/scarf solo imprimen mensajes/telemetría:
# se dejan sin ejecutar.
#
# Se declaran las dos claves a propósito (igual que en samawe): `allowBuilds` es
# la de pnpm 11 y `onlyBuiltDependencies` la de pnpm 10, la versión fijada en el
# Dockerfile. Con una sola, la otra versión vuelve a preguntar.
allowBuilds:
  '@nestjs/core': false
  '@scarf/scarf': false
  sharp: true

onlyBuiltDependencies:
  - sharp
